#==============================================================#
# 0530 pg_clustering
#==============================================================#
# Keep cluster coverage; resolve names in the connected database and for system
# catalogs (OID < 16384, identical in every database); other relations use OIDs.
pg_clustering:
  name: pg_clustering
  desc: PostgreSQL cluster or vacuum full progress (v12+)
  query: SELECT datname, pid, CASE WHEN datid = (SELECT oid FROM pg_database WHERE datname = current_database()) OR relid < 16384 THEN relid::regclass::text ELSE relid::text END AS relname, heap_tuples_scanned AS tup_scan, CASE WHEN heap_blks_total > 0 THEN 1.0 * heap_blks_scanned / heap_blks_total ELSE 0 END AS progress FROM pg_stat_progress_cluster;
  ttl: 10
  min_version: 120000
  tags: [ cluster, primary ]
  metrics:
    - datname:     { usage: LABEL ,description: "Name of database containing the table" }
    - pid:         { usage: LABEL ,description: "Process ID of backend" }
    - relname:     { usage: LABEL ,description: "Name of relation being clustered or vacuumed" }
    - tup_scan:    { usage: GAUGE ,description: "Number of heap tuples scanned" }
    - progress:    { usage: GAUGE ,description: "Progress ratio of heap blocks scanned" }


