name: Test Release

on:
  workflow_dispatch:  # 允许手动触发
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'Dockerfile.goreleaser'
      - 'LICENSE'
      - 'pg_exporter.yml'
      - 'package/**'
      - '.github/scripts/**'
      - '.github/workflows/release.yaml'
      - '.github/workflows/test-release.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Test GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Verify release Docker images
        run: |
          version=$(jq -r .version dist/metadata.json)
          bash .github/scripts/test-image.sh \
            "pgsty/pg_exporter:$version-amd64" \
            "pgsty/pg_exporter:$version-arm64"

      - name: Verify artifacts
        run: |
          echo "Generated artifacts:"
          ls -lh dist/*.tar.gz || true
          ls -lh dist/*.rpm dist/*.deb
          shopt -s nullglob
          rpms=(dist/*.rpm)
          debs=(dist/*.deb)
          test "${#rpms[@]}" -gt 0
          test "${#debs[@]}" -gt 0
          for rpm in "${rpms[@]}"; do
            [[ "$(basename "$rpm")" == pg-exporter-*.rpm ]] || {
              echo "::error file=.goreleaser.yml::unexpected RPM artifact name: $(basename "$rpm")"
              exit 1
            }
          done
          for deb in "${debs[@]}"; do
            [[ "$(basename "$deb")" == pg-exporter_*.deb ]] || {
              echo "::error file=.goreleaser.yml::unexpected DEB artifact name: $(basename "$deb")"
              exit 1
            }
          done
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 bash -euo pipefail -c '
            for rpm in /dist/*.rpm; do
              rpm -qp --provides "$rpm" | grep -qx pg_exporter
              rpm -qp --obsoletes "$rpm" | grep -qx pg_exporter
            done
          '
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" -w /src \
            debian:bookworm-slim bash .github/scripts/test-deb.sh /dist
          echo ""
          echo "Checksums:"
          (cd dist && sha256sum --check checksums.txt)
